# Эталонные дефекты docs/requirements.md — ручной разбор команды.
# Нужен только для оценки агента (eval/score.py); агент этот файл не читает.
#
# Находка агента засчитывается дефекту, если:
#   1) её строка (поле line) входит в lines дефекта, и
#   2) в quote/problem/recommendation есть хотя бы одно слово-маркер из keywords
#      (сравнение по началу слова, без учёта регистра; пустой keywords — маркер не нужен).
# key: true — ключевые противоречия, которые агент обязан найти.

document: docs/requirements.md
